# Infrastructure only. Apps run locally via pnpm (pnpm dev:api / dev:worker /
# dev:platform) and the converter runs from the sibling repo
# md-conversion-service-py. Only stateful backing services live here.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"
    volumes:
      - docs-agent-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    restart: always
    ports:
      - "16379:6379"

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - docs-agent-qdrant:/qdrant/storage

volumes:
  docs-agent-pgdata:
  docs-agent-qdrant:
